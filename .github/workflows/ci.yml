name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so a change to the API is noticed even when nothing here changes.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -s sh examples/*/*.sh

      - name: Every API call matches the API description
        run: python3 scripts/check-requests.py
