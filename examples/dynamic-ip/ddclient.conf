# /etc/ddclient.conf (or /etc/ddclient/ddclient.conf) — ddclient reporting to an InfraNest Dynamic IP source.
# Keep this file chmod 600: it holds the update password.
daemon=300                       # check every 5 minutes
use=web, web=https://api.ipify.org

protocol=dyndns2
server=dyn.infranest.io
ssl=yes
# login: the source's public id; password: its update password (Automations → Dynamic IPs → the source)
login=dyn_PUBLIC_ID
password='change-me'
# ddclient needs a hostname here; InfraNest ignores it — the source decides which records it keeps.
office.example.com
