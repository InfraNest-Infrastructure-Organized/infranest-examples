---
# Installs the InfraNest agent with the same installer as the one-line install, once per host.
# A host that already has the agent is left alone, so the role is safe to run again. To upgrade agents,
# run the installer with --upgrade (Linux) or -Upgrade (Windows); it needs no token.
#
# With infranest_agent_enrollment_key set, every host enrolls with that one key (--enroll / -Enroll) and gets its
# own server token back; running the role again on the same machine finds the same server. Without it, each
# host needs its own infranest_agent_token.

- name: Check that this host has an enrollment key or its server token
  ansible.builtin.assert:
    that:
      - infranest_agent_enrollment_key is match('^sek_') or infranest_agent_token is match('^sat_')
    fail_msg: >-
      Set infranest_agent_enrollment_key (one key for every host, from Settings → Server agent in InfraNest; it starts
      with sek_), or infranest_agent_token for {{ inventory_hostname }} (the server token from its page, Metrics →
      Install agent; it starts with sat_).
    quiet: true

- name: Install on Linux
  when: ansible_facts['os_family'] != 'Windows'
  become: true
  block:
    - name: Look for an agent that is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/infranest-agent
      register: infranest_agent_binary

    - name: Install the agent
      when: not infranest_agent_binary.stat.exists
      block:
        - name: Download the installer
          ansible.builtin.get_url:
            url: "{{ infranest_agent_installer_sh }}"
            dest: /root/infranest-agent-install.sh
            mode: "0700"

        # A server token goes in a file only root can read, so it never appears in a process list or a shell
        # history. An enrollment key has no file form; it is passed once, and the task's log is suppressed.
        - name: Write the server token for the installer
          when: not infranest_agent_enrollment_key
          ansible.builtin.copy:
            content: "{{ infranest_agent_token }}"
            dest: /root/infranest-agent-token
            mode: "0600"
          no_log: true

        - name: Run the installer
          ansible.builtin.command:
            argv: "{{ ['sh', '/root/infranest-agent-install.sh']
              + (['--enroll', infranest_agent_enrollment_key] if infranest_agent_enrollment_key
                 else ['--token-file', '/root/infranest-agent-token'])
              + (['--processes'] if infranest_agent_processes | bool else []) }}"
            creates: /usr/local/bin/infranest-agent
          no_log: "{{ infranest_agent_enrollment_key | length > 0 }}"

      always:
        - name: Remove the token file and the installer
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /root/infranest-agent-token
            - /root/infranest-agent-install.sh

- name: Install on Windows
  when: ansible_facts['os_family'] == 'Windows'
  block:
    - name: Look for an agent that is already installed
      ansible.windows.win_stat:
        path: C:\Program Files\InfraNest\infranest-agent.exe
      register: infranest_agent_binary

    - name: Install the agent
      when: not infranest_agent_binary.stat.exists
      block:
        - name: Download the installer
          ansible.windows.win_get_url:
            url: "{{ infranest_agent_installer_ps1 }}"
            dest: C:\Windows\Temp\infranest-agent-install.ps1

        - name: Write the server token for the installer
          when: not infranest_agent_enrollment_key
          ansible.windows.win_copy:
            content: "{{ infranest_agent_token }}"
            dest: C:\Windows\Temp\infranest-agent-token
          no_log: true

        - name: Run the installer
          ansible.windows.win_powershell:
            script: |
              param([bool]$Processes, [string]$Enroll)
              $installer = 'C:\Windows\Temp\infranest-agent-install.ps1'
              $options = @{}
              if ($Enroll) { $options.Enroll = $Enroll } else { $options.TokenFile = 'C:\Windows\Temp\infranest-agent-token' }
              if ($Processes) { $options.Processes = $true }
              & $installer @options
            parameters:
              Processes: "{{ infranest_agent_processes | bool }}"
              Enroll: "{{ infranest_agent_enrollment_key }}"
          no_log: "{{ infranest_agent_enrollment_key | length > 0 }}"

      always:
        - name: Remove the token file and the installer
          ansible.windows.win_file:
            path: "{{ item }}"
            state: absent
          loop:
            - C:\Windows\Temp\infranest-agent-token
            - C:\Windows\Temp\infranest-agent-install.ps1
