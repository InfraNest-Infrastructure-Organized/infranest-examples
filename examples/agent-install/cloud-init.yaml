#cloud-config
# Installs the InfraNest agent on a new Linux server's first boot. Paste it into your cloud provider's
# "user data" field, or pass it to the API or Terraform that creates the server.
#
# Replace sek_YOUR_KEY with an enrollment key, from Settings → Server agent → New key in InfraNest. The same
# file works for every server: the installer trades the key for that server's own token before it installs
# anything, and the agent only ever sees that token. The key is in the instance's user data, which anyone who
# can read the instance's configuration at your cloud provider can read too, so give it an expiry or a server
# limit if that is wider than you want.
runcmd:
  - curl -fsSL https://get.infranest.io/agent.sh -o /root/infranest-agent-install.sh
  - sh /root/infranest-agent-install.sh --enroll sek_YOUR_KEY
  - rm -f /root/infranest-agent-install.sh
